
      - name: Diagnose Android Manifest
        run: |
          echo "Checking manifest contents..."
          cat -n app/src/main/AndroidManifest.xml

          echo "Checking XML syntax..."
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML syntax is VALID')"

          echo "Checking file encoding..."
          file app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace
